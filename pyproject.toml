[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boston-ocel-extraction"
version = "0.1.0"
description = "Reproducible OCEL 2.0 extraction of Boston municipal inspections"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pm4py>=2.7,<3"]

[project.scripts]
boston-ocel = "boston_ocel.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
